{% extends "base.html" %}
{% block title %}Services | NXTWALK{% endblock %}
{% block content %}
<section class="container section">
<h1>Our Services</h1>
<div class="grid">
{% for service in services %}
<article><h2><a href="{% url 'services:detail' service.slug %}">{{ service.title }}</a></h2><p>{{ service.short_description }}</p></article>
{% empty %}
<p>No services added yet. Add them from Django Admin.</p>
{% endfor %}
</div>
</section>
{% endblock %}
