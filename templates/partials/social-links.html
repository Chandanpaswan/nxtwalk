<div class="social-links" aria-label="NXTWALK social media">
    {% for social in social_links %}
    <a class="social-icon" href="{{ social.url }}" aria-label="{{ social.name }}" title="{{ social.name }}"{% if social.open_new_tab %} target="_blank" rel="noopener noreferrer"{% endif %}>
        {% include "partials/social-icon.html" with icon=social.icon %}
    </a>
    {% endfor %}
</div>
