<form class="newsletter-form" method="post" action="{% url 'website:newsletter_subscribe' %}">
    {% csrf_token %}
    <label class="visually-hidden" for="newsletter-email">Email address for NXTWALK updates</label>
    <input type="email" name="email" id="newsletter-email" autocomplete="email" placeholder="Email address" required>
    <label class="newsletter-honeypot" aria-hidden="true">Leave this field empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" aria-label="Subscribe to NXTWALK updates">Join <span aria-hidden="true">&#8599;</span></button>
</form>
