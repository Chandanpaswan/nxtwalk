{% extends "base.html" %}
{% block title %}{{ post.title }} | NXTWALK{% endblock %}
{% block content %}
<article class="container section">
<h1>{{ post.title }}</h1>
{% if post.published_at %}<p class="muted">{{ post.published_at|date:"d M Y" }}</p>{% endif %}
<div>{{ post.content|linebreaks }}</div>
</article>
{% endblock %}
